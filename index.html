<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dart League</title>

 <link
    rel="icon"
    type="image/png"
    href="https://qspfphnailbelqmmzjbk.supabase.co/storage/v1/object/public/app-assets/favicon.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000000;
  --card:#0D0D0D;
  --card-2:#1A1A1A;
  --line:#2A2A2A;
  --accent:#F47B20;
  --white:#FFFFFF;
  --grey:#B5B5B5;
  --muted:#757575;
  --ok:#FFFFFF;
  --bad:#FFFFFF;
  --warn:#C9C9C9;
  --info:#C9C9C9;
  --r:14px;
  --nav-h:64px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--white);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* Scoreboard-cijfers: condensed, zoals op een dartbord-telbord */
.score,.stat-value,.big-num{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}

/* ---------- Layout ---------- */
#app{min-height:100dvh}

.shell{display:flex;min-height:100dvh}

.sidebar{
  display:none;
  width:220px;flex-shrink:0;
  background:var(--card);
  border-right:1px solid var(--line);
  padding:20px 12px;
  flex-direction:column;gap:4px;
  position:sticky;top:0;height:100dvh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 18px;
}
.brand-mark{
  width:26px;height:26px;border-radius:50%;
  border:3px solid var(--accent);
  position:relative;flex-shrink:0;
}
.brand-mark::after{
  content:"";position:absolute;inset:6px;
  border-radius:50%;background:var(--accent);
}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em}

.navlink{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--grey);font-size:15px;font-weight:500;
  background:none;border:0;width:100%;text-align:left;cursor:pointer;
}
.navlink:hover{background:var(--card-2);color:var(--white)}
.navlink.active{background:#1C1C1C;color:var(--accent);font-weight:600}
.navlink svg{width:20px;height:20px;flex-shrink:0}

.main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.page{max-width:900px;margin:0 auto;padding:20px 16px 40px}

.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1;background:none;border:0;cursor:pointer;
  padding:8px 2px 10px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;
}
.bottomnav button svg{width:21px;height:21px}
.bottomnav button.active{color:var(--accent)}

@media(min-width:900px){
  .sidebar{display:flex}
  .bottomnav{display:none}
  .main{padding-bottom:0}
  .page{padding:28px 32px 60px}
}

/* ---------- Typografie ---------- */
h1{font-size:26px;font-weight:700;margin:0 0 2px;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--grey);margin:0 0 24px;font-size:14px}
.section{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.section:first-of-type{margin-top:0}
.linkbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:4px}

/* ---------- Kaarten ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;
}
.card+.card{margin-top:10px}
.clickable{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.clickable:hover{border-color:#4A4A4A}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat-label{color:var(--grey);font-size:13px;margin-top:2px}
.stat-value{font-size:30px;line-height:1.05}
.stat .ico{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:#1C1C1C;color:var(--white);margin-bottom:10px;
}
.stat .ico svg{width:17px;height:17px}

/* ---------- Wedstrijdkaart ---------- */
.match-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.match-league{color:var(--muted);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mp{display:flex;align-items:center;gap:9px;min-width:0}
.mp.right{flex-direction:row-reverse;text-align:right}
.mp-name{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp.winner .mp-name{font-weight:700}
.vs{color:var(--muted);font-size:11px;font-weight:700}
.match-score{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-top:10px}
.score{font-size:32px;line-height:1;color:var(--grey)}
.score.win{color:var(--accent)}
.score-sep{color:var(--muted);font-size:20px}
.match-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:12px}

/* ---------- Avatar ---------- */
.av{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:#1F1F1F;color:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;overflow:hidden;
}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;font-size:30px}
.av.sm{width:30px;height:30px;font-size:11px}

/* ---------- Badge ---------- */
.badge{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:600;white-space:nowrap;
  border:1px solid;
}

/* ---------- Formulieren ---------- */
label{display:block;font-size:13.5px;color:var(--grey);margin-bottom:6px;font-weight:500}
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);
  color:var(--white);font-size:15px;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.field{margin-bottom:16px}
.field-error{color:var(--bad);font-size:13px;margin-top:6px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:9px;border:0;cursor:pointer;
  background:var(--accent);color:var(--white);
  font-size:15px;font-weight:600;
}
.btn:hover{background:#ff8c33}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--white)}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:8px 14px;font-size:13.5px}

.chip{
  background:var(--card);border:1px solid var(--line);color:var(--white);
  padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:9px}

.alert{padding:12px 14px;border-radius:9px;font-size:14px;margin-bottom:16px}
.alert.bad{background:#1A1A1A;border:1px solid #FFFFFF;color:#FFFFFF}
.alert.ok{background:#1A1A1A;border:1px solid #6E6E6E;color:#D8D8D8}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:400px}
.auth-head{text-align:center;margin-bottom:28px}
.auth-mark{
  width:52px;height:52px;border-radius:50%;border:5px solid var(--accent);
  margin:0 auto 16px;position:relative;
}
.auth-mark::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--accent)}
.auth-head h1{font-size:27px}
.auth-alt{text-align:center;margin-top:22px;color:var(--grey);font-size:14.5px}

/* ---------- Statusweergaven ---------- */
.state{text-align:center;padding:40px 20px;color:var(--grey)}
.state-title{color:var(--white);font-weight:600;font-size:16px;margin-bottom:6px}
.state-sub{font-size:14px;color:var(--grey);max-width:340px;margin:0 auto}
.state-ico{width:42px;height:42px;color:var(--muted);margin:0 auto 14px}

.spinner{
  width:26px;height:26px;border-radius:50%;margin:0 auto;
  border:3px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.spinner.inline{width:17px;height:17px;border-width:2px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

/* ---------- Lijstrij ---------- */
.row{display:flex;align-items:center;gap:12px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--grey);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-ico{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:#1C1C1C;color:var(--white);
  display:flex;align-items:center;justify-content:center;
}
.row-ico svg{width:20px;height:20px}

/* ---------- Modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;padding:22px;
}
.modal h2{margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 16px);z-index:80;
  background:var(--card-2);border:1px solid var(--line);
  padding:12px 18px;border-radius:10px;font-size:14px;max-width:90vw;
}
@media(min-width:900px){.toast{bottom:24px}}

.muted{color:var(--muted)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
  <div id="app">
    <div class="auth-wrap"><div class="spinner"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
