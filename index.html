<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dart League</title>

 <link
    rel="icon"
    type="image/png"
    href="https://qspfphnailbelqmmzjbk.supabase.co/storage/v1/object/public/app-assets/favicon.png">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://qspfphnailbelqmmzjbk.supabase.co/storage/v1/object/public/app-assets/favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dart League">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000000;
  --card:#0D0D0D;
  --card-2:#1A1A1A;
  --line:#2A2A2A;
  --accent:#F47B20;
  --white:#FFFFFF;
  --grey:#B5B5B5;
  --muted:#757575;
  --ok:#FFFFFF;
  --bad:#FFFFFF;
  --warn:#C9C9C9;
  --info:#C9C9C9;
  --r:14px;
  --nav-h:64px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--white);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* Scoreboard-cijfers: condensed, zoals op een dartbord-telbord */
.score,.stat-value,.big-num{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}

/* ---------- Layout ---------- */
#app{min-height:100dvh}

.shell{display:flex;min-height:100dvh}

.sidebar{
  display:none;
  width:220px;flex-shrink:0;
  background:var(--card);
  border-right:1px solid var(--line);
  padding:20px 12px;
  flex-direction:column;gap:4px;
  position:sticky;top:0;height:100dvh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 18px;
}
.brand-mark{
  width:26px;height:26px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em}

.navlink{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--grey);font-size:15px;font-weight:500;
  background:none;border:0;width:100%;text-align:left;cursor:pointer;
}
.navlink:hover{background:var(--card-2);color:var(--white)}
.navlink.active{background:#1C1C1C;color:var(--accent);font-weight:600}
.navlink svg{width:20px;height:20px;flex-shrink:0}

.main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.page{max-width:900px;margin:0 auto;padding:20px 16px 40px}

.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1;background:none;border:0;cursor:pointer;
  padding:8px 2px 10px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;
}
.bottomnav button svg{width:21px;height:21px}
.bottomnav button.active{color:var(--accent)}

@media(min-width:900px){
  .sidebar{display:flex}
  .bottomnav{display:none}
  .main{padding-bottom:0}
  .page{padding:28px 32px 60px}
}

/* ---------- Typografie ---------- */
h1{font-size:26px;font-weight:700;margin:0 0 2px;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--grey);margin:0 0 24px;font-size:14px}
.section{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.section:first-of-type{margin-top:0}
.linkbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:4px}

/* ---------- Kaarten ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;
}
.card+.card{margin-top:10px}
.clickable{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.clickable:hover{border-color:#4A4A4A}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat-label{color:var(--grey);font-size:13px;margin-top:2px}
.stat-value{font-size:30px;line-height:1.05}
.stat .ico{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:#1C1C1C;color:var(--white);margin-bottom:10px;
}
.stat .ico svg{width:17px;height:17px}

/* ---------- Wedstrijdkaart ---------- */
.match-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.match-league{color:var(--muted);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mp{display:flex;align-items:center;gap:9px;min-width:0}
.mp.right{flex-direction:row-reverse;text-align:right}
.mp-name{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp.winner .mp-name{font-weight:700}
.vs{color:var(--muted);font-size:11px;font-weight:700}
.match-score{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-top:10px}
.score{font-size:32px;line-height:1;color:var(--grey)}
.score.win{color:var(--accent)}
.score-sep{color:var(--muted);font-size:20px}
.match-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:12px}

/* ---------- Avatar ---------- */
.av{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:#1F1F1F;color:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;overflow:hidden;
}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;font-size:30px}
.av.sm{width:30px;height:30px;font-size:11px}

/* ---------- Badge ---------- */
.badge{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:600;white-space:nowrap;
  border:1px solid;
}

/* ---------- Formulieren ---------- */
label{display:block;font-size:13.5px;color:var(--grey);margin-bottom:6px;font-weight:500}
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);
  color:var(--white);font-size:15px;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.field{margin-bottom:16px}
.field-error{color:var(--bad);font-size:13px;margin-top:6px}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-pair-label{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:9px;border:0;cursor:pointer;
  background:var(--accent);color:var(--white);
  font-size:15px;font-weight:600;
}
.btn:hover{background:#ff8c33}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--white)}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.danger{background:#E74C3C}

.chip{
  background:var(--card);border:1px solid var(--line);color:var(--white);
  padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:#000}
.chips{display:flex;flex-wrap:wrap;gap:9px}

.alert{padding:12px 14px;border-radius:9px;font-size:14px;margin-bottom:16px}
.alert.bad{background:#1A1A1A;border:1px solid #FFFFFF;color:#FFFFFF}
.alert.ok{background:#1A1A1A;border:1px solid #6E6E6E;color:#D8D8D8}

/* ---------- Landing ---------- */
.landing{min-height:100dvh}
.landing-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;max-width:1180px;margin:0 auto;width:100%;box-sizing:border-box;
}
.landing-logo{width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0}
.landing-wrap{max-width:1180px;margin:0 auto;width:100%;box-sizing:border-box;padding:0 20px}

/* Hero: donker paneel met een gloed en concentrische ringen, als een dartbord op de achtergrond */
.landing-hero-panel{
  position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 15% 0%,#241304 0%,#0D0D0D 48%,#000 100%);
  border:1px solid var(--line);border-radius:24px;
  padding:44px 24px;text-align:center;
}
.landing-hero-ring{
  position:absolute;top:50%;right:-120px;transform:translateY(-50%);
  width:360px;height:360px;border-radius:50%;
  border:38px solid #F47B2010;pointer-events:none;
}
.landing-hero-ring::before{
  content:"";position:absolute;inset:60px;border-radius:50%;border:26px solid #F47B2014;
}
.landing-hero-ring::after{
  content:"";position:absolute;inset:120px;border-radius:50%;border:16px solid #F47B201C;
}
.landing-hero-inner{position:relative;max-width:640px;margin:0 auto}
.landing-eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--accent);background:#F47B201A;border:1px solid #F47B2040;
  padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  margin-bottom:20px;
}
.landing-eyebrow svg{width:13px;height:13px;flex-shrink:0}
.landing-wordmark{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:44px;line-height:1;letter-spacing:.01em;text-transform:uppercase;
  margin:0 0 16px;
  background:linear-gradient(100deg,#FFC98A 0%,var(--accent) 55%,#FF5F3D 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.landing-hero-panel .sub{
  font-size:15.5px;color:var(--grey);max-width:440px;margin:0 auto 28px;
}
.landing-cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.landing-cta .btn{padding:12px 22px;font-size:14.5px}
.landing-hero-note{margin:18px 0 0;color:var(--muted);font-size:12px;letter-spacing:.02em}

/* Infobalk direct onder de hero */
.landing-notice{
  display:flex;align-items:center;gap:10px;
  background:#F47B2014;border:1px solid #F47B2040;color:var(--accent);
  border-radius:var(--r);padding:12px 16px;font-size:13.5px;font-weight:500;
  margin:16px auto 0;max-width:1180px;
}
.landing-notice svg{width:17px;height:17px;flex-shrink:0}

/* Secties */
.landing-section{padding:56px 0 0}
.landing-section h2{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.landing-section .sub{color:var(--grey);font-size:14px;margin:0 0 22px}

/* Statistieken-voorbeeld: gekleurde tegels + wedstrijdkaart */
.landing-highlight{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
}
.landing-tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.landing-tile{
  border-radius:12px;padding:13px;background:var(--card-2);
  border:1px solid var(--line);
}
.landing-tile-label{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  color:var(--tile-c,var(--accent));margin-bottom:8px;
}
.landing-tile-label .dot{width:6px;height:6px;border-radius:50%;background:var(--tile-c,var(--accent))}
.landing-tile-value{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.landing-tile-who{color:var(--grey);font-size:12px;margin-top:2px}

/* Featuregrid met grote nummers */
.landing-feature-grid{display:grid;grid-template-columns:1fr;gap:12px}
.landing-feature{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;text-align:left;
}
.landing-feature-num{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:26px;color:var(--accent);line-height:1;margin-bottom:10px;
}
.landing-feature h3{font-size:14.5px;font-weight:700;margin:0 0 5px;letter-spacing:.01em}
.landing-feature p{font-size:13px;color:var(--grey);margin:0;line-height:1.5}

/* Stappen */
.landing-step-list{display:grid;grid-template-columns:1fr;gap:14px}
.landing-step{display:flex;gap:16px;align-items:flex-start}
.landing-step-num{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:26px;color:var(--accent);flex-shrink:0;width:36px;
}
.landing-step h3{font-size:15px;font-weight:700;margin:0 0 4px}
.landing-step p{font-size:13.5px;color:var(--grey);margin:0;line-height:1.5}

/* CTA-balk vlak boven de footer */
.landing-final{
  margin-top:56px;background:linear-gradient(100deg,#2A1605,#1A1005);
  border:1px solid #F47B2040;border-radius:18px;
  padding:26px 24px;text-align:center;
}
.landing-final h2{font-size:19px;margin:0 0 6px}
.landing-final p{color:var(--grey);font-size:13.5px;margin:0 0 18px}

.landing-foot{
  text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px 28px;
}
@media(min-width:640px){
  .landing-tile-grid{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:860px){
  .landing-hero-panel{padding:64px 40px;text-align:left}
  .landing-hero-inner{margin:0}
  .landing-eyebrow,.landing-cta{justify-content:flex-start}
  .landing-hero-panel .sub{margin:0 0 28px}
  .landing-wordmark{font-size:64px}
  .landing-highlight{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:center}
  .landing-tile-grid{grid-template-columns:repeat(2,1fr);margin-top:0}
  .landing-feature-grid{grid-template-columns:repeat(4,1fr)}
  .landing-step-list{grid-template-columns:repeat(3,1fr)}
}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:400px}
.auth-head{text-align:center;margin-bottom:28px}
.auth-mark{
  display:block;width:52px;height:52px;border-radius:50%;
  object-fit:cover;margin:0 auto 16px;
}
.auth-head h1{font-size:27px}
.auth-alt{text-align:center;margin-top:22px;color:var(--grey);font-size:14.5px}

/* ---------- Statusweergaven ---------- */
.state{text-align:center;padding:40px 20px;color:var(--grey)}
.state-title{color:var(--white);font-weight:600;font-size:16px;margin-bottom:6px}
.state-sub{font-size:14px;color:var(--grey);max-width:340px;margin:0 auto}
.state-ico{width:42px;height:42px;color:var(--muted);margin:0 auto 14px}

.spinner{
  width:26px;height:26px;border-radius:50%;margin:0 auto;
  border:3px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.spinner.inline{width:17px;height:17px;border-width:2px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

/* ---------- Lijstrij ---------- */
.row{display:flex;align-items:center;gap:12px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--grey);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-ico{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:#1C1C1C;color:var(--white);
  display:flex;align-items:center;justify-content:center;
}
.row-ico svg{width:20px;height:20px}

/* ---------- Modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;padding:22px;
}
.modal h2{margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 16px);z-index:80;
  background:var(--card-2);border:1px solid var(--line);
  padding:12px 18px;border-radius:10px;font-size:14px;max-width:90vw;
}
@media(min-width:900px){.toast{bottom:24px}}

.muted{color:var(--muted)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
  <div id="app">
    <div class="auth-wrap"><div class="spinner"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
